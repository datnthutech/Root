# Chạy toàn bộ app trong Docker ở máy local (HTTP, không HTTPS): Postgres, MinIO, backend, frontend. Dùng qua ./deploy.sh.
# Không dùng cho môi trường thật — xem docker-compose.prod.yml.
name: giapha-local
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: giapha
      POSTGRES_USER: giapha
      POSTGRES_PASSWORD: giapha
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U giapha -d giapha"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:${MINIO_PORT:-7001}:9001"]
    volumes: ["miniodata:/data"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started, required: false }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/giapha
      DB_USER: giapha
      DB_PASSWORD: giapha
      JWT_SECRET: local-dev-secret-local-dev-secret-0123456789
      COOKIE_SECURE: "false"
      SWAGGER_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: giapha
      DEV_SEED_PERSONS: ${DEV_SEED_PERSONS:-0}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-password123}
    ports: ["127.0.0.1:${API_PORT:-7080}:8080"]
  web:
    build:
      context: .
      dockerfile: ops/caddy/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # ":80" = HTTP thuần, không tự bật HTTPS/redirect (chỉ dùng local)
      DOMAIN: ":80"
    ports: ["127.0.0.1:${WEB_PORT:-7000}:80"]
volumes:
  pgdata:
  miniodata:
