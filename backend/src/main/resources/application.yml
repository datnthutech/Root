spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giapha}
    username: ${DB_USER:giapha}
    password: ${DB_PASSWORD:giapha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  forward-headers-strategy: framework
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    access-minutes: 15
    refresh-days: 14
  cookie-secure: ${COOKIE_SECURE:false}
  dev-seed:
    persons: ${DEV_SEED_PERSONS:0}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USER:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:giapha}
management:
  endpoints.web.exposure.include: health
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
