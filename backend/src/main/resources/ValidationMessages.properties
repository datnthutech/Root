# Thông báo tiếng Việt cho các ràng buộc Bean Validation mặc định (ghi đè câu tiếng Anh của Hibernate Validator).
# Frontend hiển thị nguyên văn các câu này dưới ô nhập (details của lỗi VALIDATION_FAILED).
jakarta.validation.constraints.NotBlank.message=Không được để trống
jakarta.validation.constraints.NotNull.message=Bắt buộc phải có
jakarta.validation.constraints.Pattern.message=Không đúng định dạng cho phép
# @Size chỉ dùng cho chuỗi; chọn câu theo việc có đặt min, max hay cả hai
# (Hibernate Validator mặc định cấm gọi phương thức trong biểu thức, nên nối chuỗi bằng toán tử +=)
jakarta.validation.constraints.Size.message=${min == 0 ? 'Tối đa ' += max += ' ký tự' : (max == 2147483647 ? 'Tối thiểu ' += min += ' ký tự' : 'Phải từ ' += min += ' đến ' += max += ' ký tự')}
