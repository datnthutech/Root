name: giapha-prod
services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_DB: giapha
      POSTGRES_USER: giapha
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U giapha -d giapha"]
      interval: 10s
      retries: 10
  # Kho ảnh tương thích S3. Dùng RustFS vì minio/minio đã bị gỡ khỏi Docker Hub.
  # Giữ tên service "minio" để backend/biến MINIO_* không phải đổi.
  minio:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes: ["miniodata:/data"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/giapha
      DB_USER: giapha
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: "true"
      SWAGGER_ENABLED: "false"
      # Chặn tần suất /auth/* theo IP. Luôn bật ở môi trường thật; chỉ đặt "false" tạm khi gỡ lỗi.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: giapha
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  caddy:
    build:
      context: .
      dockerfile: ops/caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ["80:80", "443:443"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
  backup:
    build: ./ops/backup
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: giapha
      PGDATABASE: giapha
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RETENTION_DAYS: "14"
    volumes:
      - backups:/backups
      - miniodata:/minio-data:ro
    healthcheck:
      # unhealthy nếu lần sao lưu thành công gần nhất (dấu .last_success) cũ hơn 26 giờ hoặc chưa có;
      # start_period chừa thời gian cho lần chạy cron đầu tiên (02:30 UTC) sau khi triển khai
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last_success -mmin -1560 2>/dev/null)\""]
      interval: 30m
      timeout: 10s
      retries: 1
      start_period: 26h
volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
  backups:
